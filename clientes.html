<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Clientes</title>
       <style>
    body {
    font-family: Arial, sans-serif;
    background-color: #f1f5f9;
    color: #1e293b;
    margin: 0;
    line-height: 1.6;
}

h1 {
    background-color: #0f172a;
    color: white;
    text-align: center;
    padding: 30px;
    margin: 0;
    font-size: 36px;
}

nav {
    background-color: #1e293b;
    text-align: center;
    padding: 18px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 8px;
    font-weight: bold;
}

nav a:hover {
    color: #38bdf8;
}

h2 {
    color: #0369a1;
    margin: 25px 20px 10px;
}

h3 {
    color: #334155;
    margin-left: 20px;
}

p {
    margin: 10px 25px;
}

body > a {
    display: inline-block;
    background-color: #0284c7;
    color: white;
    text-decoration: none;
    padding: 10px 16px;
    margin-left: 25px;
    border-radius: 6px;
}

body > a:hover {
    background-color: #075985;
}


hr {
    border: none;
    border-top: 1px solid #cbd5e1;
    margin: 25px 0;
}
</style>
</head>

<body>

    <h1>Gerenciar Clientes</h1>

    <p>Área para consultar e organizar os clientes da empresa.</p>

    <hr>

    <h2>Clientes cadastrados</h2>

    <table border="1">

        <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Última compra</th>
        </tr>

        <tr>
            <td>João</td>
            <td>joao@email.com</td>
            <td>PC Gamer</td>
        </tr>

        <tr>
            <td>Maria</td>
            <td>maria@email.com</td>
            <td>Notebook</td>
        </tr>

        <tr>
            <td>Carlos</td>
            <td>carlos@email.com</td>
            <td>Headset Gamer</td>
        </tr>

    </table>

    <h2>Cadastrar cliente</h2>

    <form>

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome">
        <br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email">
        <br><br>

        <input type="submit" value="Cadastrar cliente">

    </form>

    <hr>

    <a href="admin.html">Voltar ao painel</a>

</body>

</html>
