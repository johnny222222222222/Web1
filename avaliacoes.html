<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliações</title>
</head>

<body>

    <h1>Avalie nossa empresa</h1>

    <p>
        Sua opinião é importante para ajudar a Tech Solutions a melhorar.
    </p>

    <hr>

    <h2>Deixe sua avaliação</h2>

    <form>

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome">

        <br><br>

        <label for="produto">Produto ou serviço:</label><br>

        <select id="produto" name="produto">

            <option value="pc">PC Gamer</option>
            <option value="notebook">Notebook</option>
            <option value="headset">Headset Gamer</option>
            <option value="site">Desenvolvimento de sites</option>
            <option value="suporte">Suporte técnico</option>

        </select>

        <br><br>

        <label for="nota">Nota:</label><br>

        <select id="nota" name="nota">

            <option value="5">⭐⭐⭐⭐⭐ Excelente</option>
            <option value="4">⭐⭐⭐⭐ Muito bom</option>
            <option value="3">⭐⭐⭐ Bom</option>
            <option value="2">⭐⭐ Regular</option>
            <option value="1">⭐ Ruim</option>

        </select>

        <br><br>

        <label for="comentario">Comentário:</label><br>

        <textarea id="comentario" name="comentario" rows="5" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Enviar avaliação">

    </form>

    <hr>

    <a href="index.html">Voltar ao início</a>

</body>

</html>
