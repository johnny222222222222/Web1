<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliações</title>
       <style>
    body {
    font-family: Arial, sans-serif;
    background-color: #f1f5f9;
    color: #1e293b;
    margin: 0;
    line-height: 1.6;
}

h1 {
    background-color: #0f172a;
    color: white;
    text-align: center;
    padding: 30px;
    margin: 0;
    font-size: 36px;
}

nav {
    background-color: #1e293b;
    text-align: center;
    padding: 18px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 8px;
    font-weight: bold;
}

nav a:hover {
    color: #38bdf8;
}

h2 {
    color: #0369a1;
    margin: 25px 20px 10px;
}

h3 {
    color: #334155;
    margin-left: 20px;
}

p {
    margin: 10px 25px;
}

body > a {
    display: inline-block;
    background-color: #0284c7;
    color: white;
    text-decoration: none;
    padding: 10px 16px;
    margin-left: 25px;
    border-radius: 6px;
}

body > a:hover {
    background-color: #075985;
}


hr {
    border: none;
    border-top: 1px solid #cbd5e1;
    margin: 25px 0;
}
</style>
</head>

<body>

    <h1>Avalie nossa empresa</h1>

    <p>
        Sua opinião é importante para ajudar a Tech Solutions a melhorar.
    </p>

    <hr>

    <h2>Deixe sua avaliação</h2>

    <form>

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome">

        <br><br>

        <label for="produto">Produto ou serviço:</label><br>

        <select id="produto" name="produto">

            <option value="pc">PC Gamer</option>
            <option value="notebook">Notebook</option>
            <option value="headset">Headset Gamer</option>
            <option value="site">Desenvolvimento de sites</option>
            <option value="suporte">Suporte técnico</option>

        </select>

        <br><br>

        <label for="nota">Nota:</label><br>

        <select id="nota" name="nota">

            <option value="5">⭐⭐⭐⭐⭐ Excelente</option>
            <option value="4">⭐⭐⭐⭐ Muito bom</option>
            <option value="3">⭐⭐⭐ Bom</option>
            <option value="2">⭐⭐ Regular</option>
            <option value="1">⭐ Ruim</option>

        </select>

        <br><br>

        <label for="comentario">Comentário:</label><br>

        <textarea id="comentario" name="comentario" rows="5" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Enviar avaliação">

    </form>

    <hr>

    <a href="index.html">Voltar ao início</a>

</body>

</html>
