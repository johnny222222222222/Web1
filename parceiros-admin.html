<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Parceiros</title>
</head>

<body>

    <h1>Gerenciar Parceiros</h1>

    <p>Área destinada ao gerenciamento das empresas parceiras.</p>

    <hr>

    <h2>Parceiros cadastrados</h2>

    <ul>
        <li>Empresa de Tecnologia</li>
        <li>Empresa de Desenvolvimento</li>
        <li>Empresa de Suporte Técnico</li>
        <li>Empresa de Informática</li>
    </ul>

    <h2>Cadastrar novo parceiro</h2>

    <form>

        <label for="empresa">Nome da empresa:</label><br>
        <input type="text" id="empresa" name="empresa">
        <br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="tipo">Área de atuação:</label><br>
        <input type="text" id="tipo" name="tipo">
        <br><br>

        <input type="submit" value="Cadastrar parceiro">

    </form>

    <hr>

    <a href="admin.html">Voltar ao painel</a>

</body>

</html>
