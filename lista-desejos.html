<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Desejos</title>
</head>

<body>

    <h1>💖 Minha Lista de Desejos</h1>

    <p>
        Selecione os produtos que você gostaria de comprar futuramente.
    </p>

    <hr>

    <h2>Escolha seus favoritos</h2>

    <form>

        <input type="checkbox" id="pc" name="produto" value="pc">
        <label for="pc"> PC Gamer — R$ 3.999,00</label>

        <br><br>

        <input type="checkbox" id="notebook" name="produto" value="notebook">
        <label for="notebook"> Notebook Profissional — R$ 2.999,00</label>

        <br><br>

        <input type="checkbox" id="headset" name="produto" value="headset">
        <label for="headset"> Headset Gamer — R$ 149,90</label>

        <br><br>

        <input type="checkbox" id="teclado" name="produto" value="teclado">
        <label for="teclado">⌨ Teclado Mecânico — R$ 199,90</label>

        <br><br>

        <input type="checkbox" id="mouse" name="produto" value="mouse">
        <label for="mouse"> Mouse Gamer — R$ 99,90</label>

        <br><br>

        <input type="submit" value="Salvar minha lista">

    </form>

    <hr>

    <h2> Dica</h2>

    <p>
        Adicione seus produtos favoritos à lista para lembrar deles
        quando decidir realizar sua próxima compra.
    </p>

    <a href="compras.html"> Ir para compras</a>

    <br><br>

    <a href="index.html">Voltar ao início</a>

</body>

</html>
